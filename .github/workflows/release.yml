# Builds the Windows NSIS installer and publishes it, together with the
# auto-update metadata (latest.yml + .blockmap), to the GitHub Release that
# matches the pushed tag. Trigger: push a tag like v1.0.2 whose number equals
# "version" in package.json.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # create the release and upload assets

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and publish
        # GITHUB_TOKEN is provided by Actions at build time only; it is never
        # embedded in the application.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
